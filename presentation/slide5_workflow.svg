<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520">
  <defs>
    <style>
      .step-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
      .step-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .step-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; fill: #475569; line-height: 1.5; }
      .arrow { fill: #94a3b8; }
      .banner-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .banner-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #64748b; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="520" fill="#ffffff" />

  <!-- Top Banner -->
  <rect x="40" y="20" width="1520" height="65" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="65" y="48" class="banner-title">PROJECT END-TO-END WORKFLOW</text>
  <text x="65" y="69" class="banner-sub">How an academic project moves from student submission to live university showcase</text>

  <!-- STEP 1 CARD -->
  <g transform="translate(40, 115)" filter="url(#shadow)">
    <rect width="320" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="320" height="8" rx="4" fill="#3b82f6" />
    
    <!-- Step Badge -->
    <rect x="24" y="28" width="90" height="28" rx="14" fill="#eff6ff" />
    <text x="69" y="46" class="step-num" fill="#2563eb" text-anchor="middle">STEP 01</text>
    
    <!-- Icon Circle -->
    <circle cx="60" cy="105" r="30" fill="#dbeafe" />
    <text x="60" y="113" font-size="28" text-anchor="middle">👨‍🎓</text>

    <text x="24" y="175" class="step-title">Student Upload</text>
    
    <text x="24" y="215" class="step-desc">• Fills project title &amp; overview</text>
    <text x="24" y="245" class="step-desc">• Selects category &amp; batch</text>
    <text x="24" y="275" class="step-desc">• Adds GitHub link &amp; screenshot</text>
    <text x="24" y="305" class="step-desc">• Clicks "Submit Project"</text>
  </g>

  <!-- ARROW 1 -->
  <g transform="translate(375, 275)">
    <path d="M 0 0 L 25 0 M 18 -7 L 25 0 L 18 7" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- STEP 2 CARD -->
  <g transform="translate(425, 115)" filter="url(#shadow)">
    <rect width="320" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="320" height="8" rx="4" fill="#6366f1" />
    
    <!-- Step Badge -->
    <rect x="24" y="28" width="90" height="28" rx="14" fill="#eef2ff" />
    <text x="69" y="46" class="step-num" fill="#4f46e5" text-anchor="middle">STEP 02</text>
    
    <!-- Icon Circle -->
    <circle cx="60" cy="105" r="30" fill="#e0e7ff" />
    <text x="60" y="113" font-size="28" text-anchor="middle">⚙️</text>

    <text x="24" y="175" class="step-title">Backend &amp; DB</text>
    
    <text x="24" y="215" class="step-desc">• Server validates inputs</text>
    <text x="24" y="245" class="step-desc">• Saves image to /uploads</text>
    <text x="24" y="275" class="step-desc">• Inserts record in MySQL</text>
    <text x="24" y="305" class="step-desc">• Status set to: "Pending"</text>
  </g>

  <!-- ARROW 2 -->
  <g transform="translate(760, 275)">
    <path d="M 0 0 L 25 0 M 18 -7 L 25 0 L 18 7" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- STEP 3 CARD -->
  <g transform="translate(810, 115)" filter="url(#shadow)">
    <rect width="320" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="320" height="8" rx="4" fill="#f59e0b" />
    
    <!-- Step Badge -->
    <rect x="24" y="28" width="90" height="28" rx="14" fill="#fef3c7" />
    <text x="69" y="46" class="step-num" fill="#d97706" text-anchor="middle">STEP 03</text>
    
    <!-- Icon Circle -->
    <circle cx="60" cy="105" r="30" fill="#fde68a" />
    <text x="60" y="113" font-size="28" text-anchor="middle">👨‍🏫</text>

    <text x="24" y="175" class="step-title">Faculty Review</text>
    
    <text x="24" y="215" class="step-desc">• Reviews in Pending queue</text>
    <text x="24" y="245" class="step-desc">• Inspects GitHub repository</text>
    <text x="24" y="275" class="step-desc">• Clicks "Approve" button</text>
    <text x="24" y="305" class="step-desc">• (Or Rejects with feedback)</text>
  </g>

  <!-- ARROW 3 -->
  <g transform="translate(1145, 275)">
    <path d="M 0 0 L 25 0 M 18 -7 L 25 0 L 18 7" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- STEP 4 CARD -->
  <g transform="translate(1195, 115)" filter="url(#shadow)">
    <rect width="320" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="320" height="8" rx="4" fill="#10b981" />
    
    <!-- Step Badge -->
    <rect x="24" y="28" width="90" height="28" rx="14" fill="#dcfce7" />
    <text x="69" y="46" class="step-num" fill="#15803d" text-anchor="middle">STEP 04</text>
    
    <!-- Icon Circle -->
    <circle cx="60" cy="105" r="30" fill="#bbf7d0" />
    <text x="60" y="113" font-size="28" text-anchor="middle">🌐</text>

    <text x="24" y="175" class="step-title">Live Showcase</text>
    
    <text x="24" y="215" class="step-desc">• Status changes to "Approved"</text>
    <text x="24" y="245" class="step-desc">• Instantly visible on Explore</text>
    <text x="24" y="275" class="step-desc">• Searchable by batch &amp; tech</text>
    <text x="24" y="305" class="step-desc">• Permanent campus archive</text>
  </g>
</svg>