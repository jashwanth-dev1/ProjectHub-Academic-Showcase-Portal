<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #64748b; }
      .th { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .td-id { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; dominant-baseline: central; }
      .td-bold { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .td-regular { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #334155; }
      .badge-pass { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 800; fill: #15803d; text-anchor: middle; dominant-baseline: central; }
      .footer-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #166534; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="760" fill="#ffffff" />

  <!-- Top Title Banner -->
  <rect x="40" y="20" width="1520" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="65" y="52" class="title">TEST CASES &amp; VERIFICATION MATRIX</text>
  <text x="65" y="74" class="subtitle">ProjectHub REST API &amp; Role-Based Security Testing (Node.js + MySQL 8.0 + Postman)</text>

  <!-- Table Container -->
  <g transform="translate(40, 105)">
    <!-- Header -->
    <rect x="0" y="0" width="1520" height="48" fill="#1e3a8a" rx="4" />
    <text x="25" y="30" class="th">TEST ID</text>
    <text x="160" y="30" class="th">TEST SCENARIO / INPUT</text>
    <text x="640" y="30" class="th">EXPECTED RESULT</text>
    <text x="1060" y="30" class="th">ACTUAL RESULT</text>
    <text x="1455" y="30" class="th" text-anchor="middle">STATUS</text>

    <!-- Outer Table Border -->
    <rect x="0" y="0" width="1520" height="468" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="4" />

    <!-- Row 1 (TC-01) -->
    <rect x="0" y="48" width="1520" height="84" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="25" y="74" width="80" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="65" y="90" class="td-id">TC-01</text>
    <text x="160" y="85" class="td-bold">Student Login with valid credentials</text>
    <text x="160" y="105" class="td-regular">(Email: student@campus.edu, Password: Password123!)</text>
    <text x="640" y="85" class="td-regular">200 OK + Signed JWT Bearer token</text>
    <text x="640" y="105" class="td-regular">Session initialized with 'student' role</text>
    <text x="1060" y="85" class="td-regular">Token received successfully;</text>
    <text x="1060" y="105" class="td-regular">Student dashboard session loaded</text>
    <rect x="1415" y="74" width="80" height="32" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="1455" y="90" class="badge-pass">PASS</text>

    <!-- Row 2 (TC-02) -->
    <rect x="0" y="132" width="1520" height="84" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="25" y="158" width="80" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="65" y="174" class="td-id">TC-02</text>
    <text x="160" y="169" class="td-bold">Unauthenticated client accesses restricted route</text>
    <text x="160" y="189" class="td-regular">(GET /api/projects/pending without token)</text>
    <text x="640" y="169" class="td-regular">401 Unauthorized / Access Denied</text>
    <text x="640" y="189" class="td-regular">Protected endpoint blocks execution</text>
    <text x="1060" y="169" class="td-regular">Request blocked by authenticateToken</text>
    <text x="1060" y="189" class="td-regular">middleware; error payload returned</text>
    <rect x="1415" y="158" width="80" height="32" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="1455" y="174" class="badge-pass">PASS</text>

    <!-- Row 3 (TC-03) -->
    <rect x="0" y="216" width="1520" height="84" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="25" y="242" width="80" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="65" y="258" class="td-id">TC-03</text>
    <text x="160" y="253" class="td-bold">Student submits project with missing fields</text>
    <text x="160" y="273" class="td-regular">(POST /api/projects/add without category or batch)</text>
    <text x="640" y="253" class="td-regular">400 Bad Request with validation message</text>
    <text x="640" y="273" class="td-regular">No incomplete records inserted into DB</text>
    <text x="1060" y="253" class="td-regular">Rejection returned: "Title, description,</text>
    <text x="1060" y="273" class="td-regular">category &amp; batch are required"</text>
    <rect x="1415" y="242" width="80" height="32" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="1455" y="258" class="badge-pass">PASS</text>

    <!-- Row 4 (TC-04) -->
    <rect x="0" y="300" width="1520" height="84" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <rect x="25" y="326" width="80" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="65" y="342" class="td-id">TC-04</text>
    <text x="160" y="337" class="td-bold">Faculty clicks 'Approve' on a pending submission</text>
    <text x="160" y="357" class="td-regular">(PUT /api/projects/status/1 with status: "Approved")</text>
    <text x="640" y="337" class="td-regular">Status updated to 'Approved' in MySQL</text>
    <text x="640" y="357" class="td-regular">Project instantly viewable in public showcase</text>
    <text x="1060" y="337" class="td-regular">State updated in DB; instant visibility</text>
    <text x="1060" y="357" class="td-regular">confirmed on Explore &amp; search endpoints</text>
    <rect x="1415" y="326" width="80" height="32" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="1455" y="342" class="badge-pass">PASS</text>

    <!-- Row 5 (TC-05) -->
    <rect x="0" y="384" width="1520" height="84" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="25" y="410" width="80" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="65" y="426" class="td-id">TC-05</text>
    <text x="160" y="421" class="td-bold">Student attempts to delete an approved project</text>
    <text x="160" y="441" class="td-regular">(DELETE /api/projects/1 by student owner)</text>
    <text x="640" y="421" class="td-regular">400 Bad Request (Action restricted)</text>
    <text x="640" y="441" class="td-regular">Database record remains intact</text>
    <text x="1060" y="421" class="td-regular">Deletion blocked: "Approved projects</text>
    <text x="1060" y="441" class="td-regular">cannot be deleted directly by students"</text>
    <rect x="1415" y="410" width="80" height="32" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="1455" y="426" class="badge-pass">PASS</text>
  </g>

  <!-- Footer Summary Banner -->
  <rect x="40" y="590" width="1520" height="50" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="800" y="621" class="footer-text">VERIFICATION SUMMARY:  5 of 5 Test Cases Passed (100% Pass Rate)   |   0 Failures   |   Verified via Postman &amp; MySQL 8.0</text>
</svg>